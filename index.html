<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

const pages={scan:{name:'3D Scanning',title:'3D LiDAR Scanning Services',sub:'Laser Scanning, Point Clouds & Reality Capture',intro:'Get accurate, detailed, and reliable building data with professional 3D LiDAR scanning services. Using advanced laser scanning and reality capture technology, we capture precise measurements of buildings, structures, and environments to create high-quality 3D point clouds, digital models, and as-built documentation.',blocks:[['What Is 3D LiDAR Scanning?','3D LiDAR scanning (Light Detection and Ranging) uses laser measurements to digitally capture the exact dimensions, geometry, and details of a physical environment. The scanning process creates a highly accurate 3D point cloud containing millions of measurement points that represent real-world conditions.'],['3D LiDAR Scanning Applications','Existing Conditions & As-Built Surveys. Scan to BIM Services. Construction Progress & Verification Scanning. MEP Documentation. Pre-Drywall & Behind-the-Wall Documentation. Retail & Commercial Building Scanning. Historical & Heritage Building Documentation.'],['Benefits of 3D Laser Scanning Services','High-accuracy 3D measurements. Faster site data collection. Complete digital building records. Reduced manual measuring. Improved design accuracy. Better construction coordination. Supports BIM workflows. Accurate as-built documentation. Reduced site visits. Improved facility management. Long-term digital preservation.'],['Industries We Serve','Architecture, Engineering & Construction (AEC). Commercial Construction. Retail & Shopping Centres. Restaurants & Hospitality. Commercial Real Estate. Industrial Facilities. Manufacturing Plants. Warehouses. Healthcare Facilities. Educational Institutions. Historical & Heritage Buildings. Facility Management.']]},asbuilt:{name:'As-Built Surveys',title:'As-Built Documentation & Scan to BIM Services',sub:'Accurate 3D Building Records',intro:'Create accurate, reliable, and detailed as-built documentation with adva de architectural elements, building layouts, structural components, interior spaces, mechanical systems, electrical systems, plumbing systems, equipment, fixtures, furniture, and building assets.'],['2D CAD Drawings & Drafting Services','Generate accurate 2D CAD drawings from laser scans, point clouds, existing documentation, or field measurements. Services include floor plans, elevations, sections, reflected ceiling plans, site plans, equipment layouts, MEP drawings, as-built drawings, and construction documentation.'],['Revit BIM Modeling Services','Develop intelligent Revit BIM models for design, construction, and operations. Services support architectural BIM models, structural BIM models, MEP BIM models, Scan to BIM workflows, existing condition modeling, renovation and retrofit projects, clash detection, construction coordination, and facility management models.'],['Benefits of 3D Modelling & BIM Services','Accurate digital building representation. Improved design coordination. Reduced measurement errors. Faster renovation planning. Better communication between project teams. Supports BIM workflows. Improved construction coordination. Reliable as-built documentation. Enhanced visualization. Long-term digital building records.']]},tours:{name:'3D Virtual Tours',title:'3D Virtual Tours',sub:'3D Virtual Tours for Construction, Retail, Commercial Buildings, Real Estate & Historical Documentation',intro:'Document, manage, preserve, and showcase properties with immersive 3D virtual tours. Using advanced reality capture technology, we create accurate digital walkthroughs that provide a permanent visual record of buildings, spaces, and environments.',blocks:[['3D Virtual Tours Throughout the Entire Project Lifecycle','Existing Conditions & As-Built Documentation. Retail Store Documentation & Rollouts. Demolition & Renovation Documentation. Construction Progress Monitoring. MEP & Behind-the-Walls Documentation. Pre-Drywall Documentation. Final As-Built & Digital Twin Documentation. Historical Building Documentation & Preservation. Retail, Restaurant & Commercial Marketing.'],['Benefits of 3D Virtual Tour Documentation','Interactive 360° virtual walkthroughs. Retail store documentation and rollout support. Complete project timeline documentation. Historical preservation and archival records. Accurate as-built documentation. Reduced site visits and improved remote collaboration. Better communication between owners, contractors, retailers, and consultants. Permanent digital records for future reference. Improved facility management and building operations. Easy online sharing with clients, teams, and stakeholders.'],['Industries We Serve','Retail Stores & Shopping Centres. Restaurants & Hospitality. Commercial Construction. Architecture, Engineering & Construction (AEC). Commercial Real Estate. Property Management. Industrial Facilities. Warehouses & Distribution Centres. Healthcare Facilities. Educational Institutions. Museums & Heritage Sites. Historical Buildings & Preservation Projects.']]},confined:{name:'Confined Spaces',title:'Confined Space 3D Laser Scanning',sub:'',intro:'3D laser scanning provides a safe, efficient way to capture highly accurate measurements and existing conditions inside confined and hazardous spaces without exposing personnel to unnecessary risks.',blocks:[['Benefits','Reduce or eliminate the need for personnel to enter hazardous spaces during data collection. Capture accurate as-built conditions for engineering, maintenance, and construction. Improve project planning before maintenance or shutdowns. Assist with rescue planning by creating detailed digital models of confined spaces. Create permanent digital documentation for future inspections and facility management. Reduce downtime while increasing worker safety.'],['Applications','Utility vaults. Manholes. Industrial tanks. Boilers. Silos. Process vessels. Tunnels. Mechanical rooms. Crawl spaces. Pipelines. Water and wastewater facilities. Mining and industrial infrastructure.'],['Need to Safely Document a Confined or Hazardous Space?','Our team can assess your project and recommend an appropriate 3D laser scanning solution.']]},docs:{name:'3D Documentation',title:'Complete 3D Documentation Throughout the Entire Project Lifecycle',sub:'',intro:'3D documentation provides a comprehensive digital record of your project from start to finish. By capturing accurate reality data at every stage, project teams gain complete visibility, reduce costly errors, and maintain a permanent record of construction progress.',blocks:[['Documentation Milestones','Existing Conditions / As-Built Scanning. Demolition. Structural Construction. MEP Installation. Rewiring & Renovations. Pre-Drywall Documentation. Final As-Built Documentation. Project Handover & Grand Opening.'],['Continuous 3D Documentation','Continuous 3D documentation ensures every phase of a project is accurately recorded, supporting collaboration, facility management, risk reduction, and reliable as-built documentation throughout the building lifecycle.']]}};

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function chunks(s){return s.split('. ').filter(Boolean).map(x=>x.replace(/\.$/,''))}function pills(a){return `<div class="pill-cloud">${a.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`}function setNav(active){document.getElementById('links').innerHTML=nav.map(n=>`<a class="${active===n[0]?'active':''}" href="#${n[0]}">${n[1]}</a>`).join('')}
function home(){setNav('home');return `<section class="hero wrap"><h1>See the built world with <em>clarity.</em></h1><div class="hero-copy"><div class="eyebrow">3Dintersekt / reality capture</div><p class="lead">Accurate reality data for design, construction, renovation, inspection, facility management, and the entire building lifecycle.</p><div class="actions"><a class="btn" href="mailto:info@3dintersekt.com?subject=3Dintersekt%20quote">Request a quote ↗</a><a class="btn outline" href="#services">Explore services ↓</a></div></div><aside class="hero-aside"><strong>Built around what is actually there.</strong>From the first scan to the final digital record, 3Dintersekt gives teams a dependable source of truth for smarter decisions.<div class="signal">Ready for reality</div></aside></section><section class="section alt" id="services"><div class="wrap"><div class="intro"><div><div class="eyebrow">Services</div><h2>One source of truth for every phase.</h2></div><div><p>From existing conditions to final handover, we capture the details teams need to make confident decisions and reduce costly surprises.</p></div></div><div class="service-grid">${serviceCards.map((s,i)=>`<article class="service"><div class="service-icon">${icons[s[0]]}</div><h3>${s[1]}</h3><p>${s[2]}</p><a href="#${s[0]}">View service ↗</a></article>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="intro"><div><div class="eyebrow">Why 3Dintersekt</div><h2>Measure once. Move smarter.</h2></div><div><p>Reliable digital records improve coordination between owners, architects, engineers, contractors, operators, and stakeholders.</p></div></div><div class="feature-row"><div class="feature"><div class="mini-icon">${icons.scan}</div><strong>Capture reality</strong><p>Precise 3D measurements and complete existing conditions.</p></div><div class="feature"><div class="mini-icon">${icons.model}</div><strong>Coordinate better</strong><p>Use shared digital information across design and construction.</p></div><div class="feature"><div class="mini-icon">${icons.docs}</div><strong>Keep it useful</strong><p>Maintain dependable records for future work and facility management.</p></div></div></div></section><section class="workflow"><div class="wrap"><div class="eyebrow">Project workflow</div><h2>From physical space to digital data.</h2><div class="flow">${['Physical space','3D LiDAR scanning','Point cloud data','CAD / BIM / Digital twin','Design, construction, facility management'].map((x,i)=>`<div class="flow-step"><span class="step-no">0${i+1}</span><strong>${x}</strong></div>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="intro"><div><div class="eyebrow">Industries</div><h2>Built for the people who build.</h2></div><div><p>Supporting commercial, industrial, retail, heritage, healthcare, education, and facility management projects.</p>${pills(['Architecture, Engineering & Construction','Commercial Construction','Retail & Shopping Centres','Restaurants & Hospitality','Commercial Real Estate','Industrial Facilities','Manufacturing Plants','Warehouses','Healthcare Facilities','Educational Institutions','Historical & Heritage Buildings','Facility Management'])}</div></div></div></section><section class="cta"><div class="wrap"><div class="eyebrow">Start with the real thing</div><h2>Accurate 3D data for smarter building decisions.</h2><p>Whether you need 3D LiDAR laser scanning, point cloud data, as-built documentation, Scan to BIM, or digital twin solutions, our reality capture services provide accurate digital information for design, construction, and building management.</p><a class="btn" href="mailto:info@3dintersekt.com?subject=3Dintersekt%20quote">Request a quote ↗</a></div></section>`}
function service(key){const p=pages[key];setNav(key);return `<section class="page-hero"><div class="wrap"><div class="eyebrow">Service / ${p.name}</div><h1>${esc(p.title)}</h1>${p.sub?`<div class="sub">${esc(p.sub)}</div>`:''}</div></section><section class="detail-section"><div class="wrap"><div class="detail-grid"><div><div class="eyebrow">Overview</div><h2>Accurate information, from first scan to final record.</h2></div><div><p class="muted">${esc(p.intro)}</p><div class="actions"><a class="btn" href="mailto:info@3dintersekt.com?subject=Service%20quote">Request a quote ↗</a><a class="btn outline" href="#details">Explore details ↓</a></div></div></div><div id="details">${p.blocks.map((b,i)=>`<article class="detail-card"><span class="step-no">${String(i+1).padStart(2,'0')}</span><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p></article>`).join('')}</div></div></section><section class="detail-section alt"><div class="wrap"><div class="detail-grid"><div><div class="eyebrow">What this supports</div><h2>Information that keeps moving.</h2></div><div>${pills(chunks(p.blocks.map(b=>b[1]).join('. ')))}</div></div></div></section><section class="cta"><div class="wrap"><div class="eyebrow">Ready when you are</div><h2>Accurate digital information for smarter design, construction, and building management.</h2><a class="btn" href="mailto:info@3dintersekt.com?subject=Service%20quote">Request a quote ↗</a></div></section>`}
function render(){const key=location.hash.slice(1)||'home';document.getElementById('app').innerHTML=key==='home'?home():pages[key]?service(key):home();document.title=(key==='home'?'3Dintersekt':pages[key].name)+' | 3Dintersekt';document.getElementById('links').classList.remove('open');window.scrollTo({top:0,behavior:'instant'})}window.addEventListener('hashchange',render);window.addEventListener('scroll',()=>document.getElementById('backtop').classList.toggle('show',scrollY>500));render();
